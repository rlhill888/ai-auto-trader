name: Deploy Lambdas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - dir: polling-article-lambda
            function_name_secret: POLLING_ARTICLE_LAMBDA_NAME
          - dir: analysis-trading-lambda
            function_name_secret: ANALYSIS_TRADING_LAMBDA_NAME

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          pip install --target . -r requirements.txt

      - name: Zip package
        run: |
          cd ${{ matrix.dir }}
          zip -r ../${{ matrix.dir }}.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets[matrix.function_name_secret] }} \
            --zip-file fileb://${{ matrix.dir }}.zip
