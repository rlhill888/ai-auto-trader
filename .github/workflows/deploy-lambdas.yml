name: Deploy Lambdas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - dir: polling-article-lambda
            function_name_secret: POLLING_ARTICLE_LAMBDA_NAME
            use_s3: false
          - dir: analysis-trading-lambda
            function_name_secret: ANALYSIS_TRADING_LAMBDA_NAME
            use_s3: false
          - dir: ai-trade-checker
            function_name_secret: AI_TRADE_CHECKER_LAMBDA_NAME
            use_s3: false
          - dir: reset-daily-ai-trading-values-lambda
            function_name_secret: RESET_DAILY_AI_TRADING_VALUES_LAMBDA_NAME
            use_s3: false
          - dir: ai-trader-weekly-synopsis-lambda
            function_name_secret: AI_TRADER_WEEKLY_SYNOPSIS_LAMBDA_NAME
            use_s3: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          pip install --target . -r requirements.txt

      - name: Zip package
        run: |
          cd ${{ matrix.dir }}
          zip -r ../${{ matrix.dir }}.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload package to S3
        if: ${{ matrix.use_s3 }}
        run: |
          aws s3 cp ${{ matrix.dir }}.zip s3://ai-auto-trader-lambda-artifact/${{ matrix.dir }}.zip

      - name: Deploy to Lambda via S3
        if: ${{ matrix.use_s3 }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets[matrix.function_name_secret] }} \
            --s3-bucket ai-auto-trader-lambda-artifact \
            --s3-key ${{ matrix.dir }}.zip

      - name: Deploy to Lambda directly
        if: ${{ !matrix.use_s3 }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets[matrix.function_name_secret] }} \
            --zip-file fileb://${{ matrix.dir }}.zip
